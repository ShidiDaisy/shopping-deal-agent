[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopping-deal-agent"
version = "0.1.0"
description = "Compliance-first price and restock monitor for fashion products"
requires-python = ">=3.11"
dependencies = [
    "scrapling[fetchers]>=0.5,<1",
    "click>=8.1",
    "pydantic>=2.6,<3",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
sda = "shopping_deal_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
